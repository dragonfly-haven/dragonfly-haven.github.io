<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coming soon</title>
  <link rel="preload" href="../fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("../fonts/eb-garamond-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --ivory: #fffdf6;
      --ink: #2b2a27;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 0.5rem;
      padding: 1.5rem 1rem;
      background: var(--ivory);
      color: var(--ink);
      font: 19px/1.6 "EB Garamond", Georgia, "Times New Roman", serif;
    }

    #coelacanth {
      width: min(92vw, 72vh, 760px);
      aspect-ratio: 1;
    }

    p {
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="coelacanth" aria-hidden="true"></div>
  <p>Coming soon</p>

  <script type="module">
    import { mountEvolution } from './sketch.js';

    // The coelacanth gathers out of drifting dust, rests a while, and drifts apart to gather again.
    const e = mountEvolution(document.getElementById('coelacanth'), {
      motifs: new URL('manifest.json', import.meta.url).href,
      hold: 3,
    });
    e.loaded.then(() => { e.advance(Number(new URLSearchParams(location.search).get('t'))); e.pause(); });
  </script>
</body>
</html>

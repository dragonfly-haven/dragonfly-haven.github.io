<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Latimeria · Coming soon</title>
  <link rel="preload" href="../fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="../animations/coelacanth.js">
  <link rel="modulepreload" href="../animations/coelacanth-gl.js">
  <link rel="modulepreload" href="../animations/core.js">
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("../fonts/eb-garamond-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --ivory: #fffdf6;
      --muted: #6e685d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 2rem;
      padding: 2rem 1rem;
      background: var(--ivory);
      color: var(--muted);
      font: 19px/1.6 "EB Garamond", Georgia, "Times New Roman", serif;
    }

    #coelacanth {
      width: min(90vw, 720px);
      aspect-ratio: 2;
    }

    p {
      font-size: clamp(0.8rem, 0.6rem + 0.5vw, 1rem);
      letter-spacing: 0.32em;
      margin-right: -0.32em; /* cancels the tracking after the last letter */
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="coelacanth" aria-hidden="true"></div>
  <p>Coming soon</p>

  <script type="module">
    import { mountCoelacanth } from '../animations/coelacanth.js';

    mountCoelacanth(document.getElementById('coelacanth'), { rise: true, rest: 0 });
  </script>
</body>
</html>

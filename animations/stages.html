<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution stages</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <h1>The twenty stages</h1>
  <p class="note">Each stage held still, as the triangles settle into it. <a href="evolution.html">See them flow</a>.</p>
  <div class="grid" id="sheet" style="margin-top: 2rem"></div>

  <script type="module">
    import { mountEvolution, STAGES } from './evolution.js';

    // ?from=5&to=8&min=540 shows a few stages larger.
    const params = new URLSearchParams(location.search);
    const first = Number(params.get('from') || 1) - 1, last = Number(params.get('to') || STAGES.length) - 1;
    const sheet = document.getElementById('sheet');
    if (params.has('min')) sheet.style.gridTemplateColumns = `repeat(auto-fill, minmax(${params.get('min')}px, 1fr))`;
    const tune = {};
    for (const key of ['size', 'gap']) if (params.has(key)) tune[key] = Number(params.get(key));

    STAGES.forEach((stage, i) => {
      if (i < first || i > last) return;
      const figure = document.createElement('figure');
      figure.innerHTML = `<div class="stage"></div><figcaption><strong>${i + 1}.</strong> ${stage.name}</figcaption>`;
      sheet.append(figure);
      mountEvolution(figure.querySelector('.stage'), { ...tune, still: i });
    });
  </script>
</body>
</html>

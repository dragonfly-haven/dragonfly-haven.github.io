<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution animation</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <h1>Evolution</h1>
  <nav><a href="stages.html">All twenty stages, held still</a><a href="../">On the page</a></nav>
  <div class="big" id="evolution"></div>
  <div class="controls">
    <button id="prev" aria-label="Previous stage">‹</button>
    <output id="label">&nbsp;</output>
    <button id="next" aria-label="Next stage">›</button>
    <button id="pause">Pause</button>
  </div>

  <script type="module">
    import { mountEvolution, STAGES } from './evolution.js';

    // Anything in the address tunes it for comparison, e.g. ?stage=11&size=2&gap=1.3
    const params = new URLSearchParams(location.search);
    const tune = {};
    for (const key of ['size', 'gap', 'hold', 'move']) if (params.has(key)) tune[key] = Number(params.get(key));
    if (params.get('gpu') === 'off') tune.gpu = false;

    const label = document.getElementById('label');
    const show = (i) => (label.textContent = `${i + 1}. ${STAGES[i].name}`);
    const evolution = mountEvolution(document.getElementById('evolution'), {
      ...tune,
      start: Number(params.get('stage') || 1) - 1,
      onStage: show,
    });
    show(evolution.stage);
    if (params.has('t')) {
      evolution.advance(Number(params.get('t')));
      evolution.pause();
    }

    const go = (step) => {
      evolution.go(evolution.stage + step);
      show(evolution.stage);
    };
    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);
    const pause = document.getElementById('pause');
    pause.onclick = () => {
      const paused = pause.textContent === 'Pause';
      paused ? evolution.pause() : evolution.play();
      pause.textContent = paused ? 'Play' : 'Pause';
    };
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
      if (e.key === ' ') {
        e.preventDefault();
        pause.click();
      }
    });
  </script>
</body>
</html>

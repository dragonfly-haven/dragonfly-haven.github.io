<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragonfly animation</title>
  <link rel="stylesheet" href="preview.css">
  <style>
    .sizes {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 2.5rem;
      margin-top: 2rem;
    }

    .sizes figure > div {
      aspect-ratio: 1;
    }
  </style>
</head>
<body>
  <h1>Dragonfly</h1>
  <nav id="styles"></nav>
  <p class="note" id="about"></p>
  <div class="sizes" id="sizes"></div>
  <div class="controls" style="justify-content: flex-start">
    <button id="soften">Make round</button>
    <button id="sharpen">Make sharp</button>
  </div>

  <script type="module">
    import { mountDragonfly, DRAGONFLY_STYLES } from './dragonfly.js';

    const params = new URLSearchParams(location.search);
    const style = params.get('style') || 'crystallise';
    document.getElementById('styles').innerHTML = Object.keys(DRAGONFLY_STYLES)
      .map((s) => `<a href="?style=${s}"${s === style ? ' aria-current="page"' : ''}>${s}</a>`)
      .join('') + '<a href="index.html">all options</a>';
    document.getElementById('about').textContent = {
      crystallise: 'Round shapes crack into triangles in a wave from the body outwards, once. Hover over a dragonfly to soften it again.',
      shatter: 'Circles burst into triangles that swirl into place, then melt back now and then. Hover to soften it.',
      sharpen: 'Circles break into round dots that drift into place and then sharpen into triangles, now and then reversing. Hover to soften it.',
    }[style];

    const sizes = [[88, 'smallest on the site'], [150, 'largest on the site'], [240, 'larger'], [360, 'to see the detail']];
    const flies = sizes.map(([px, note]) => {
      const figure = document.createElement('figure');
      figure.innerHTML = `<div style="width:${px}px"></div><figcaption><strong>${px} px</strong> ${note}</figcaption>`;
      document.getElementById('sizes').append(figure);
      const fly = mountDragonfly(figure.querySelector('div'), { style });
      if (params.has('t')) fly.advance(Number(params.get('t')));
      return fly;
    });
    document.getElementById('soften').onclick = () => flies.forEach((f) => f.soften());
    document.getElementById('sharpen').onclick = () => flies.forEach((f) => f.sharpen());
  </script>
</body>
</html>

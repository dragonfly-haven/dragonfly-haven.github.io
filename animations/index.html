<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animations</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <h1>Animations</h1>
  <nav>
    <a href="evolution.html">Evolution, large, with stage controls</a>
    <a href="stages.html">The twenty stages, held still</a>
    <a href="dragonfly.html">Dragonfly</a>
    <a href="../">On the page</a>
  </nav>
  <div class="big" id="evolution"></div>
  <p class="note" id="now" style="text-align: center; margin: 0.75rem auto 0">&nbsp;</p>

  <script type="module">
    import { mountEvolution, STAGES } from './evolution.js';

    const now = document.getElementById('now');
    mountEvolution(document.getElementById('evolution'), { onStage: (i) => (now.textContent = `${i + 1}. ${STAGES[i].name}`) });
  </script>
</body>
